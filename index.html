<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* handles mobile browser bars */
      object-fit: contain; /* swap to "cover" to fill the screen and crop edges */
      cursor: zoom-in;
      user-select: none;
    }
    body.fs img { cursor: zoom-out; }
  </style>
</head>
<body>
  <img src="image.png" alt="" draggable="false">

  <script>
    // Click/tap = toggle true browser fullscreen (hides tabs + address bar)
    // Press F also works. Esc exits like normal.
    const toggle = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    };
    document.addEventListener('click', toggle);
    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'f') toggle();
    });
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('fs', !!document.fullscreenElement);
    });
  </script>
</body>
</html>
